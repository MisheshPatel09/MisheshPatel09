<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Mishesh Patel — AI/ML Developer. I build intelligence into systems.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
  text { font-family: 'Outfit', system-ui, -apple-system, sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .bounce { animation: bounce 3s cubic-bezier(.3,0,.2,1) infinite; }
  @keyframes bounce { 0%,30%,100%{transform:translateY(0)} 12%{transform:translateY(-14px)} 22%{transform:translateY(3px)} }
  .wave { transform-origin: 805px 505px; animation: wave 4s ease-in-out infinite; }
  @keyframes wave { 0%,60%,100%{transform:rotate(0)} 10%,30%{transform:rotate(16deg)} 20%,40%{transform:rotate(-10deg)} 50%{transform:rotate(6deg)} }
  .bubble { opacity:0; animation: bubble 9s cubic-bezier(.3,1.4,.5,1) infinite; }
  @keyframes bubble { 0%{opacity:0;transform:scale(.6)} 4%,30%{opacity:1;transform:scale(1)} 33.3%,100%{opacity:0;transform:scale(.9)} }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important} .first{opacity:1} }
</style>
<defs>
  <clipPath id="card"><rect width="1200" height="600" rx="24"/></clipPath>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08"/>
  </pattern>
  <pattern id="dither" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="2" height="2" fill="#0b0b0c"/><rect x="2" y="2" width="2" height="2" fill="#0b0b0c"/>
  </pattern>
</defs>
<g clip-path="url(#card)">
  <!-- Vibrant Blue Background from misheshpatel.vercel.app -->
  <rect width="1200" height="600" fill="#2261e9"/>
  <!-- Portfolio bg-grid overlay -->
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- Portfolio Navbar Header -->
  <g transform="translate(60, 48)">
    <!-- Name & Title on Left (exact from portfolio: font-bold Mishesh Patel, mt-1 font-normal AI/ML Developer) -->
    <text x="0" y="24" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">Mishesh Patel</text>
    <text x="0" y="52" font-size="18" font-weight="400" fill="#ffffff" opacity="0.85" letter-spacing="-0.015em">AI/ML Developer</text>

    <!-- Location Pill -->
    <g transform="translate(195, 3)">
      <rect x="0" y="0" width="138" height="28" rx="14" fill="#ffffff" opacity="0.15"/>
      <circle cx="16" cy="14" r="4" fill="#17b26a"/>
      <text x="28" y="19" font-size="12" font-weight="600" fill="#ffffff">Gujarat, India</text>
    </g>

    <!-- Get in touch button on Right (exact from portfolio button) -->
    <g transform="translate(930, 2)">
      <rect x="0" y="0" width="150" height="38" rx="19" fill="#ffffff" opacity="0.15" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.35"/>
      <text x="24" y="24" font-size="14" font-weight="600" fill="#ffffff">Get in touch</text>
      <!-- Arrow icon -->
      <path d="M115 15 L125 25 M125 15 L125 25 L115 25" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(2, -3) rotate(-45 120 20)"/>
    </g>
  </g>

  <!-- Big Hero Headline (exact from portfolio: "I build intelligence into systems.") -->
  <g transform="translate(60, 240)">
    <text x="0" y="80" font-size="78" font-weight="700" fill="#ffffff" letter-spacing="-0.04em">I build intelligence into</text>
    
    <g transform="translate(0, 175)">
      <text x="0" y="0" font-size="82" font-weight="300" fill="#ffffff" opacity="0.95" letter-spacing="-0.04em">systems</text>
      <!-- Animated Bouncing Dot in accent lime/yellow -->
      <text class="bounce" style="animation-delay:0.1s; display:inline-block;" x="270" y="0" font-size="82" font-weight="700" fill="#bef264">.</text>
    </g>

    <!-- Subtitle tagline from portfolio -->
    <text x="0" y="240" font-size="20" font-weight="400" fill="#ffffff" opacity="0.8" letter-spacing="-0.01em">
      Specialising in machine learning systems, distributed APIs &amp; intelligent software.
    </text>
  </g>

  <!-- Right Side Avatar & Animated Waving Hand -->
  <image href="data:image/png;base64," x="750" y="195" width="430" height="405"/>
  <g class="wave">
    <image href="data:image/png;base64," x="763" y="416" width="84" height="96"/>
  </g>

  <!-- Interactive Speech Bubbles (exact words from misheshpatel.vercel.app mascot) -->
  <g class="bubble first" style="animation-delay:0s; transform-origin:860px 240px">
    <path d="M570 166h320a18 18 0 0 1 18 18v22a18 18 0 0 1-18 18h-6l14 22-34-22h-294a18 18 0 0 1-18-18v-22a18 18 0 0 1 18-18z" fill="url(#dither)" transform="translate(6 6)"/>
    <path d="M570 166h320a18 18 0 0 1 18 18v22a18 18 0 0 1-18 18h-6l14 22-34-22h-294a18 18 0 0 1-18-18v-22a18 18 0 0 1 18-18z" fill="#fbfbf8"/>
    <text x="590" y="200" font-size="15" font-weight="700" fill="#0b0b0c">Hi, I'm <tspan fill="#2261e9">Mishesh</tspan>. Scroll down to see my work!</text>
  </g>

  <g class="bubble" style="animation-delay:3s; transform-origin:860px 240px">
    <path d="M640 166h250a18 18 0 0 1 18 18v22a18 18 0 0 1-18 18h-6l14 22-34-22h-224a18 18 0 0 1-18-18v-22a18 18 0 0 1 18-18z" fill="url(#dither)" transform="translate(6 6)"/>
    <path d="M640 166h250a18 18 0 0 1 18 18v22a18 18 0 0 1-18 18h-6l14 22-34-22h-224a18 18 0 0 1-18-18v-22a18 18 0 0 1 18-18z" fill="#fbfbf8"/>
    <text x="660" y="200" font-size="15" font-weight="700" fill="#0b0b0c">AI Models &amp; Distributed APIs ⚡</text>
  </g>

  <g class="bubble" style="animation-delay:6s; transform-origin:860px 240px">
    <path d="M610 166h280a18 18 0 0 1 18 18v22a18 18 0 0 1-18 18h-6l14 22-34-22h-254a18 18 0 0 1-18-18v-22a18 18 0 0 1 18-18z" fill="url(#dither)" transform="translate(6 6)"/>
    <path d="M610 166h280a18 18 0 0 1 18 18v22a18 18 0 0 1-18 18h-6l14 22-34-22h-254a18 18 0 0 1-18-18v-22a18 18 0 0 1 18-18z" fill="#fbfbf8"/>
    <text x="630" y="200" font-size="15" font-weight="700" fill="#0b0b0c">Building scalable intelligent apps 🚀</text>
  </g>
</g>
</svg>