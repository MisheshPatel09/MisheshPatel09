<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Thanks for scrolling! Write me anytime at misheshpatel.vercel.app">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
  text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
  .wave { transform-origin: 1044px 248px; animation: wave 3s ease-in-out infinite; }
  @keyframes wave { 0%,70%,100%{transform:rotate(0)} 10%,30%{transform:rotate(14deg)} 20%,40%{transform:rotate(-8deg)} 50%{transform:rotate(4deg)} }
  .sea { animation: sea 3s ease-in-out infinite; }
  @keyframes sea { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important} }
</style>
<defs>
  <clipPath id="fcard"><rect width="1200" height="240" rx="24"/></clipPath>
</defs>
<g clip-path="url(#fcard)">
  <!-- Vibrant Blue Background -->
  <rect width="1200" height="240" fill="#2261e9"/>

  <!-- Animated Sea Waves -->
  <path class="sea" style="animation-delay:-0.42s" d="M123 176q12 -9 24 0" fill="none" stroke="#fbfbf8" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>
  <path class="sea" style="animation-delay:-1.95s" d="M301 176q12 -9 24 0" fill="none" stroke="#fbfbf8" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>
  <path class="sea" style="animation-delay:-1.20s" d="M451 176q12 -9 24 0" fill="none" stroke="#fbfbf8" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>
  <path class="sea" style="animation-delay:-0.87s" d="M658 176q12 -9 24 0" fill="none" stroke="#fbfbf8" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>
  <path class="sea" style="animation-delay:-0.18s" d="M798 176q12 -9 24 0" fill="none" stroke="#fbfbf8" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>
  <path class="sea" style="animation-delay:-1.61s" d="M73 204q12 -9 24 0" fill="none" stroke="#fbfbf8" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>
  <path class="sea" style="animation-delay:-2.34s" d="M207 204q12 -9 24 0" fill="none" stroke="#fbfbf8" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>
  <path class="sea" style="animation-delay:-0.32s" d="M392 204q12 -9 24 0" fill="none" stroke="#fbfbf8" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>
  <path class="sea" style="animation-delay:-2.83s" d="M503 204q12 -9 24 0" fill="none" stroke="#fbfbf8" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>
  <path class="sea" style="animation-delay:-2.49s" d="M641 204q12 -9 24 0" fill="none" stroke="#fbfbf8" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>
  <path class="sea" style="animation-delay:-0.78s" d="M841 204q12 -9 24 0" fill="none" stroke="#fbfbf8" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>

  <!-- Footer Text -->
  <text x="56" y="104" font-size="52" font-weight="800" fill="#fbfbf8" letter-spacing="-1">Thanks for scrolling!</text>
  <text x="58" y="152" font-size="20" font-weight="700" fill="#fbfbf8" opacity=".9">Write me anytime at <tspan fill="#bef264">misheshpatel.vercel.app</tspan></text>

  <!-- Waving Hand -->
  <g class="wave">
    <image href="data:image/png;base64," x="960" y="64" width="168" height="192" style="image-rendering:pixelated"/>
  </g>
</g>
</svg>